# ===========================================================================
# CI/CD - CREDISCORE-BSIC
# ===========================================================================
# S'execute a chaque push et pull request sur la branche principale.
# Verifie que le code s'installe, que les modules cles s'importent, et que
# les tests automatiques passent.
# ===========================================================================

name: CI CREDISCORE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Tests du backend
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installer les dependances necessaires aux tests (version allegee)
      - name: Installer les dependances
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      # Verifier que les modules cles s'importent sans erreur
      - name: Verifier les imports
        working-directory: ./backend
        run: |
          python -c "from app.model_service import ServiceModele; print('model_service OK')"
          python -c "from app.explication import generer_explication; print('explication OK')"
          python -c "from app.security import hacher_mot_de_passe; print('security OK')"

      # Lancer les tests automatiques
      - name: Lancer les tests
        working-directory: ./backend
        run: pytest tests/ -v